name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Install Typst
        env:
          TYPST_VERSION: "0.13.1"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            --output "$RUNNER_TEMP/typst.tar.xz"
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: deno task check
      - name: Install Micro
        run: sudo -n apt-get update && sudo -n apt-get install -y micro
      - run: deno task test
      - run: deno task build
      - name: Micro terminal integration
        run: python3 tests/micro_smoke.py
      - name: Debian package and packaged terminal integration
        run: |
          ./packaging/debian/build-deb.sh
          dpkg-deb --extract dist/billie_*.deb "$RUNNER_TEMP/billie-deb"
          BILLIE_TEST_BINARY="$RUNNER_TEMP/billie-deb/usr/bin/billie" python3 tests/micro_smoke.py
